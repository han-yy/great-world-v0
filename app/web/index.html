<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一个持续生长、因果可回放的世界原型">
  <title>刚开业的世界</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">WORLD 00 · 社区商业中心</p>
        <h1>你走进了一个世界。</h1>
        <p class="subtitle">你不知道它是不是刚刚开始。</p>
      </div>
      <div class="world-meta" aria-live="polite">
        <span id="world-name">尚未进入</span>
        <span>时刻 <strong id="world-tick">—</strong></span>
        <button id="fork-button" class="quiet" type="button" disabled>从此处分叉</button>
      </div>
    </header>

    <main id="world-app" class="world-grid" hidden>
      <aside class="panel self-panel">
        <p class="panel-label">你此刻知道的</p>
        <h2 id="self-name">来客</h2>
        <p id="self-location" class="muted">位置未知</p>
        <div class="divider"></div>
        <h3>关于孩子</h3>
        <p id="child-description" class="body-small"></p>
        <div id="child-capabilities" class="chips"></div>
        <p id="child-goal" class="goal-card">ta 还没有选择目标。</p>
      </aside>

      <section class="panel map-panel">
        <div class="panel-heading">
          <div>
            <p class="panel-label">可观察空间</p>
            <h2>一座刚开业的社区商业中心</h2>
          </div>
          <button id="refresh-button" class="icon-button" type="button" aria-label="刷新">↻</button>
        </div>
        <div id="location-grid" class="location-grid"></div>
        <p class="epistemic-note">这里只呈现你有理由知道的事。缺失的信息不是空白数据，而是尚未发生在你经验中的世界。</p>
      </section>

      <aside class="panel action-panel">
        <p class="panel-label">做一件事</p>
        <form id="action-form">
          <label for="action-kind">行动</label>
          <select id="action-kind" name="kind">
            <option value="move">去一个地方</option>
            <option value="speak">说一句话</option>
            <option value="wish">投下愿望</option>
            <option value="explore">仔细探索</option>
          </select>

          <div id="move-fields" class="action-fields">
            <label for="move-destination">目的地</label>
            <select id="move-destination"></select>
          </div>

          <div id="speak-fields" class="action-fields" hidden>
            <label for="speech-text">你要说什么</label>
            <textarea id="speech-text" maxlength="500" placeholder="所有在附近的人都可能听见。"></textarea>
          </div>

          <div id="wish-fields" class="action-fields" hidden>
            <label for="wish-text">你的愿望</label>
            <textarea id="wish-text" maxlength="500" placeholder="孩子可以选择它、重新理解它，也可以拒绝它。"></textarea>
          </div>

          <div id="explore-fields" class="action-fields" hidden>
            <label for="explore-target">观察对象</label>
            <select id="explore-target"></select>
            <label for="explore-aspect">寻找什么</label>
            <select id="explore-aspect">
              <option value="condition">状态与痕迹</option>
              <option value="history">过去留下的线索</option>
              <option value="access">可能的入口</option>
            </select>
          </div>

          <button id="act-button" class="primary" type="submit">确认行动</button>
        </form>
        <button id="advance-button" class="secondary" type="button">让世界回应一次</button>
        <p id="action-status" class="status" role="status"></p>
      </aside>

      <section class="panel timeline-panel">
        <div class="panel-heading">
          <div>
            <p class="panel-label">你的经历</p>
            <h2>最近发生在你眼前的事</h2>
          </div>
        </div>
        <ol id="timeline" class="timeline"></ol>
      </section>

      <section class="panel wishes-panel">
        <p class="panel-label">许愿池</p>
        <h2>仍在水面上的愿望</h2>
        <div id="wish-pool" class="wish-pool"></div>
      </section>
    </main>
  </div>

  <dialog id="consent-dialog" class="consent-dialog">
    <form id="consent-form" method="dialog">
      <p class="eyebrow">现实层 · 进入前须知</p>
      <h2>先知道你正在进入什么</h2>
      <div id="consent-copy" class="consent-copy"></div>
      <label for="display-name">现实层显示名</label>
      <input id="display-name" required maxlength="80" autocomplete="name" placeholder="仅用于现实层参与记录">
      <div id="access-code-fields" hidden>
        <label for="access-code">受邀测试邀请码</label>
        <input id="access-code" type="password" minlength="12" maxlength="200" autocomplete="off" placeholder="由邀请者提供">
      </div>
      <label class="check-row">
        <input id="consent-check" type="checkbox" required>
        <span>我理解并同意以上内容；进入世界后，角色的技术来源不会被标注。</span>
      </label>
      <button class="primary" type="submit">同意并进入</button>
      <p id="consent-error" class="status error" role="alert"></p>
    </form>
  </dialog>

  <template id="timeline-item-template">
    <li>
      <span class="timeline-tick"></span>
      <div>
        <p class="timeline-title"></p>
        <p class="timeline-detail"></p>
      </div>
    </li>
  </template>
  <script src="/static/app.js" defer></script>
</body>
</html>
