<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一座仍在生产、生活并持续记住后果的千禧钢铁厂城">
  <title>千禧钢城 · 曙光钢铁联合厂</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="place-kicker">千禧钢城 · 曙光钢铁联合厂</p>
        <h1>新世纪的日子从这里继续。</h1>
        <p class="subtitle">钢厂正在换班，家属区、医院、学校、商店和餐厅照常生活。你可以直接说此刻想做什么。</p>
      </div>
      <div class="world-meta" aria-live="polite">
        <span id="world-name">正在开门</span>
        <button id="refresh-button" class="quiet" type="button">看看现在</button>
      </div>
    </header>

    <main id="world-app" class="world-grid" hidden>
      <section class="panel scene-panel">
        <div class="panel-heading">
          <div>
            <p class="section-note">你在这里</p>
            <h2 id="self-location">位置未知</h2>
            <p class="muted">大家叫你 <span id="self-name">来客</span>。</p>
          </div>
        </div>
        <div id="location-grid" class="location-grid"></div>
        <p class="plain-note">在不同地方，你会遇见不同的人和事。这里不会替你标注一个人的技术来源。</p>
      </section>

      <aside class="panel child-panel">
        <p class="section-note">住在这里的孩子</p>
        <h2>ta 还在慢慢长大</h2>
        <p id="child-description" class="body-small"></p>
        <p id="child-capabilities" class="body-small"></p>
        <p id="child-goal" class="child-thought">ta 暂时没有决定接下来专心做什么。</p>
      </aside>

      <section class="panel moment-panel">
        <form id="moment-form">
          <label for="moment-input">此刻，你想做什么？</label>
          <textarea id="moment-input" maxlength="1000" required
            placeholder="比如：我去蓝鲸餐厅看看今天有什么，路上和遇到的人打声招呼。"></textarea>
          <div class="moment-footer">
            <p>用你自己的话写。可以一次说完整，不需要先选择类型。</p>
            <button id="moment-submit" class="primary" type="submit">继续</button>
          </div>
        </form>
        <p id="moment-status" class="status" role="status"></p>
        <div id="turn-feedback" class="turn-feedback" aria-live="polite" hidden>
          <p class="section-note">这里的反馈</p>
          <div id="turn-feedback-items"></div>
        </div>
      </section>

      <section class="panel timeline-panel">
        <div class="panel-heading">
          <div>
            <p class="section-note">刚刚</p>
            <h2>发生在你身边的事</h2>
          </div>
        </div>
        <ol id="timeline" class="timeline"></ol>
      </section>

      <section class="panel wishes-panel">
        <p class="section-note">新世纪愿望留言台</p>
        <h2>人们想在这里做成的事</h2>
        <div id="wish-pool" class="wish-pool"></div>
      </section>
    </main>
  </div>

  <dialog id="consent-dialog" class="consent-dialog">
    <form id="consent-form" method="dialog">
      <p class="place-kicker">现实层 · 进入前须知</p>
      <h2>先知道你正在进入什么</h2>
      <div id="consent-copy" class="consent-copy"></div>
      <label for="display-name">现实层显示名</label>
      <input id="display-name" required maxlength="80" autocomplete="name" placeholder="仅用于现实层参与记录">
      <div id="access-code-fields" hidden>
        <label for="access-code">受邀测试邀请码</label>
        <input id="access-code" type="password" minlength="12" maxlength="200" autocomplete="off" placeholder="由邀请者提供">
      </div>
      <label class="check-row">
        <input id="consent-check" type="checkbox" required>
        <span>我理解并同意以上内容；进入世界后，角色的技术来源不会被标注。</span>
      </label>
      <button class="primary consent-submit" type="submit">同意并进入</button>
      <p id="consent-error" class="status error" role="alert"></p>
    </form>
  </dialog>

  <template id="timeline-item-template">
    <li>
      <p class="timeline-title"></p>
      <p class="timeline-detail"></p>
    </li>
  </template>
  <script src="/static/app.js" defer></script>
</body>
</html>
